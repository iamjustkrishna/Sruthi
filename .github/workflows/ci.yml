name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      # A cached target can restore DirectML.dll as a symlink into the ONNX
      # Runtime cache. tauri-build copies the tracked DLL onto that path, which
      # fails if the link is dangling, so drop the cached entry first.
      - name: Clear the cached DirectML DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "src-tauri/target/release/DirectML.dll"
          if ([System.IO.File]::Exists($path)) {
            Write-Output "$path is a regular file or a working link"
          } else {
            Write-Output "$path is absent or a dangling link"
          }
          [System.IO.File]::Delete($path)

      - name: Run the Rust tests
        working-directory: src-tauri
        run: cargo test --release --lib

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check
