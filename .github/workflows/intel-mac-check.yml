name: Intel Mac check

# Manual only. Answers one question without touching a release: does Sruthi
# compile for Intel Macs (x86_64-apple-darwin), including the speech engine?
# Run it from the Actions tab. It builds nothing that gets published.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with the Intel target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: intel-check

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Compile for Intel
        working-directory: src-tauri
        run: cargo check --release --lib --target x86_64-apple-darwin
