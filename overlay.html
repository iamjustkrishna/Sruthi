<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Srutam Dictate overlay</title>
    <link rel="stylesheet" href="/src/overlay.css" />
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body data-align="start">
    <div class="pill" id="pill" data-phase="recording">
      <div class="mark" id="mark">
        <span class="halo" aria-hidden="true"></span>
        <span class="spinner" aria-hidden="true"></span>
        <img class="logo" src="/src/assets/srutam-logo.png" alt="" />
        <svg class="badge" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" />
          <path d="M7 12.5l3.2 3.2L17 9" />
        </svg>
      </div>
      <div class="body">
        <span class="wave" id="wave" aria-hidden="true"></span>
        <span class="label" id="label" role="status"></span>
      </div>
    </div>
  </body>
</html>
