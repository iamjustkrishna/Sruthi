[package]
name = "srutam-dictate"
version = "0.1.0"
description = "Offline voice dictation for Windows and macOS"
authors = ["Krishna"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "srutam_dictate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Audio capture
cpal = "0.18"
# Local speech-to-text (Parakeet via ONNX Runtime)
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
# transcribe-rs 0.3.12 targets ort rc.12; rc.14 changed the session API.
ort = "=2.0.0-rc.12"
# Text insertion
arboard = "3"
enigo = "0.6"
# Model download
reqwest = { version = "0.13", features = ["blocking"] }
tar = "0.4"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
dirs = "7"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
# UI Automation, to find the focused text field in apps without a Win32 caret
windows = { version = "0.61", features = ["Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility"] }
