<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sruthi result</title>
    <link rel="stylesheet" href="/src/result.css" />
    <script type="module" src="/src/result.ts" defer></script>
  </head>
  <body>
    <section class="card" id="card" aria-live="polite">
      <header>
        <img class="logo" src="/src/assets/sruthi-logo.png" alt="" />
        <span class="title">No text field selected</span>
        <button class="close" id="close" aria-label="Close" title="Close">×</button>
      </header>
      <p class="text" id="text"></p>
      <p class="meta" id="meta" hidden></p>
      <footer>
        <span class="hint">Copy it, then paste wherever you need it.</span>
        <button class="copy" id="copy">Copy</button>
      </footer>
      <div class="timer" aria-hidden="true"><span id="timer"></span></div>
    </section>
  </body>
</html>
